name: TaskFlow CI/CD Pipeline (Docker & AWS)

on:
  push:
    branches: [ "main", "develop" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io

jobs:
  # =========================================================================
  # 1. CONTINUOUS INTEGRATION: LINT & BUILD VERIFICATION
  # =========================================================================
  test-and-verify:
    name: Lint & Build Verification
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: |
            server/package-lock.json
            client/package-lock.json

      - name: Verify Backend Dependencies
        working-directory: server
        run: |
          npm ci

      - name: Verify Frontend Build & Lint
        working-directory: client
        run: |
          npm ci
          npm run lint || true
          npm run build

  # =========================================================================
  # 2. DOCKER IMAGE BUILD & PUSH TO GITHUB CONTAINER REGISTRY (GHCR)
  # =========================================================================
  build-and-push:
    name: Build & Push Docker Images
    needs: test-and-verify
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image_tag: ${{ steps.meta.outputs.sha_short }}
      owner: ${{ steps.lower_owner.outputs.owner }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set short Git commit SHA
        id: meta
        run: echo "sha_short=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT

      - name: Convert repository owner to lowercase for Docker tags
        id: lower_owner
        run: |
          OWNER=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')
          echo "owner=$OWNER" >> $GITHUB_OUTPUT
          echo "OWNER=$OWNER" >> $GITHUB_ENV

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry (GHCR)
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & Push Backend Production Image
        uses: docker/build-push-action@v6
        with:
          context: ./server
          file: ./server/Dockerfile.prod
          push: true
          tags: |
            ghcr.io/${{ env.OWNER }}/taskflow-server:latest
            ghcr.io/${{ env.OWNER }}/taskflow-server:${{ steps.meta.outputs.sha_short }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build & Push Frontend Production Image
        uses: docker/build-push-action@v6
        with:
          context: ./client
          file: ./client/Dockerfile.prod
          push: true
          tags: |
            ghcr.io/${{ env.OWNER }}/taskflow-client:latest
            ghcr.io/${{ env.OWNER }}/taskflow-client:${{ steps.meta.outputs.sha_short }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # =========================================================================
  # 3. CONTINUOUS DEPLOYMENT: AWS SYSTEMS MANAGER (SSM) / SSH FALLBACK
  # =========================================================================
  deploy:
    name: Deploy to AWS EC2
    needs: build-and-push
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_REGION: ${{ secrets.AWS_REGION || 'us-east-1' }}
      EC2_HOST: ${{ secrets.EC2_HOST }}
      SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # --- Method A: Fully Automated AWS Systems Manager (SSM) Deployment ---
      - name: Configure AWS Credentials
        if: env.AWS_ACCESS_KEY_ID != ''
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Deploy via AWS Systems Manager (SSM)
        if: env.AWS_ACCESS_KEY_ID != ''
        env:
          IMAGE_TAG: ${{ needs.build-and-push.outputs.image_tag }}
          OWNER: ${{ needs.build-and-push.outputs.owner }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ACTOR: ${{ github.actor }}
          MONGODB_URI: ${{ secrets.MONGODB_URI }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          GRAFANA_ADMIN_PASSWORD: ${{ secrets.GRAFANA_ADMIN_PASSWORD || 'AdminTaskFlow123!' }}
        run: |
          echo "Discovering EC2 instance via tag Project=taskflow..."
          INSTANCE_ID=$(aws ec2 describe-instances \
            --filters "Name=tag:Project,Values=taskflow" "Name=instance-state-name,Values=running" \
            --query "Reservations[].Instances[].InstanceId" \
            --output text)

          if [ -z "$INSTANCE_ID" ]; then
            echo "::error ::No running EC2 instance found with tag Project=taskflow"
            exit 1
          fi

          echo "Targeting EC2 Instance: $INSTANCE_ID"

          DEPLOY_SCRIPT=$(cat << 'EOF'
          set -e
          git config --global --add safe.directory '*'
          DEPLOY_DIR="/home/ubuntu/taskflow-app"
          mkdir -p "$DEPLOY_DIR"
          cd "$DEPLOY_DIR"

          # Sync repository configuration
          REPO_URL="https://x-access-token:__GHCR_TOKEN__@github.com/__REPO__.git"
          if [ ! -d ".git" ]; then
            git clone "$REPO_URL" .
          else
            git remote set-url origin "$REPO_URL"
            git fetch origin "__REF_NAME__"
            git checkout "__REF_NAME__" 2>/dev/null || git checkout -b "__REF_NAME__" "origin/__REF_NAME__" 2>/dev/null || git reset --hard "origin/__REF_NAME__"
            git reset --hard "origin/__REF_NAME__"
          fi

          chown -R ubuntu:ubuntu "$DEPLOY_DIR"

          mkdir -p server client
          cat << 'ENVFILE' > server/.env
          NODE_ENV=production
          PORT=5000
          MONGODB_URI=__MONGODB_URI__
          JWT_SECRET=__JWT_SECRET__
          JWT_EXPIRE=7d
          UPLOAD_DIR=uploads
          ENVFILE

          cat << 'ENVFILE' > .env
          NODE_ENV=production
          PORT=5000
          MONGODB_URI=__MONGODB_URI__
          JWT_SECRET=__JWT_SECRET__
          JWT_EXPIRE=7d
          UPLOAD_DIR=uploads
          BACKEND_IMAGE=__BACKEND_IMAGE__
          FRONTEND_IMAGE=__FRONTEND_IMAGE__
          GRAFANA_ADMIN_PASSWORD=__GRAFANA_ADMIN_PASSWORD__
          ENVFILE

          echo "VITE_API_URL=/api" > client/.env

          echo "__GHCR_TOKEN__" | docker login ghcr.io -u "__ACTOR__" --password-stdin

          export BACKEND_IMAGE="__BACKEND_IMAGE__"
          export FRONTEND_IMAGE="__FRONTEND_IMAGE__"
          export GRAFANA_ADMIN_PASSWORD="__GRAFANA_ADMIN_PASSWORD__"

          docker compose -f docker-compose.prod.yml pull
          docker compose -f docker-compose.prod.yml up -d --remove-orphans
          docker image prune -f

          echo "Verifying application health..."
          for i in $(seq 1 30); do
            if curl -sf http://localhost/api/health > /dev/null; then
              echo "TaskFlow API is healthy and reachable!"
              exit 0
            fi
            sleep 2
          done

          echo "Health check timed out!"
          exit 1
          EOF
          )

          DEPLOY_PAYLOAD=$(echo "$DEPLOY_SCRIPT" \
            | sed "s|__GHCR_TOKEN__|${GHCR_TOKEN}|g" \
            | sed "s|__REPO__|${GITHUB_REPOSITORY}|g" \
            | sed "s|__REF_NAME__|${GITHUB_REF_NAME:-main}|g" \
            | sed "s|__MONGODB_URI__|${MONGODB_URI:-mongodb://mongo:27017/taskflow}|g" \
            | sed "s|__JWT_SECRET__|${JWT_SECRET:-taskflow_super_secret_jwt_key_2024}|g" \
            | sed "s|__BACKEND_IMAGE__|ghcr.io/${OWNER}/taskflow-server:${IMAGE_TAG}|g" \
            | sed "s|__FRONTEND_IMAGE__|ghcr.io/${OWNER}/taskflow-client:${IMAGE_TAG}|g" \
            | sed "s|__GRAFANA_ADMIN_PASSWORD__|${GRAFANA_ADMIN_PASSWORD}|g" \
            | sed "s|__ACTOR__|${ACTOR}|g" \
            | base64 -w 0)

          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name "AWS-RunShellScript" \
            --comment "TaskFlow Deployment ${IMAGE_TAG}" \
            --parameters "{\"commands\":[\"echo $DEPLOY_PAYLOAD | base64 -d | bash\"]}" \
            --query "Command.CommandId" \
            --output text)

          echo "Triggered SSM command: $COMMAND_ID"
          echo "Waiting for execution to complete..."

          aws ssm wait command-executed --command-id "$COMMAND_ID" --instance-id "$INSTANCE_ID" || true

          STATUS=$(aws ssm get-command-invocation --command-id "$COMMAND_ID" --instance-id "$INSTANCE_ID" --query "Status" --output text)
          OUTPUT=$(aws ssm get-command-invocation --command-id "$COMMAND_ID" --instance-id "$INSTANCE_ID" --query "StandardOutputContent" --output text)
          ERROR_OUTPUT=$(aws ssm get-command-invocation --command-id "$COMMAND_ID" --instance-id "$INSTANCE_ID" --query "StandardErrorContent" --output text)

          echo "=== SSM Execution Output ==="
          echo "$OUTPUT"

          if [ "$STATUS" != "Success" ]; then
            echo "=== SSM Execution Errors ==="
            echo "$ERROR_OUTPUT"
            exit 1
          fi

          echo "TaskFlow deployment with AWS SSM completed successfully!"

      # --- Method B: SSH Deployment Fallback (Used if AWS_ACCESS_KEY_ID is not provided) ---
      - name: Deploy via SSH (Fallback)
        if: env.AWS_ACCESS_KEY_ID == '' && env.EC2_HOST != '' && env.SSH_PRIVATE_KEY != ''
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USER: ${{ secrets.EC2_USER || 'ubuntu' }}
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          IMAGE_TAG: ${{ needs.build-and-push.outputs.image_tag }}
          OWNER: ${{ needs.build-and-push.outputs.owner }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ACTOR: ${{ github.actor }}
          MONGODB_URI: ${{ secrets.MONGODB_URI }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          GRAFANA_ADMIN_PASSWORD: ${{ secrets.GRAFANA_ADMIN_PASSWORD || 'AdminTaskFlow123!' }}
        run: |
          mkdir -p ~/.ssh
          echo "$SSH_PRIVATE_KEY" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H "$EC2_HOST" >> ~/.ssh/known_hosts

          ssh "$EC2_USER@$EC2_HOST" "mkdir -p /home/ubuntu/taskflow-app"
          scp docker-compose.prod.yml "$EC2_USER@$EC2_HOST":/home/ubuntu/taskflow-app/docker-compose.prod.yml
          scp -r monitoring "$EC2_USER@$EC2_HOST":/home/ubuntu/taskflow-app/

          ssh "$EC2_USER@$EC2_HOST" "bash -s" << EOF
            set -e
            cd /home/ubuntu/taskflow-app

            mkdir -p server client
            if [ ! -f server/.env ]; then
              cat << 'ENVFILE' > server/.env
          NODE_ENV=production
          PORT=5000
          MONGODB_URI=${MONGODB_URI:-mongodb://mongo:27017/taskflow}
          JWT_SECRET=${JWT_SECRET:-taskflow_super_secret_jwt_key_2024}
          JWT_EXPIRE=7d
          UPLOAD_DIR=uploads
          ENVFILE
            fi

            echo "VITE_API_URL=/api" > client/.env
            echo "${GHCR_TOKEN}" | docker login ghcr.io -u "${ACTOR}" --password-stdin

            export BACKEND_IMAGE="ghcr.io/${OWNER}/taskflow-server:${IMAGE_TAG}"
            export FRONTEND_IMAGE="ghcr.io/${OWNER}/taskflow-client:${IMAGE_TAG}"
            export GRAFANA_ADMIN_PASSWORD="${GRAFANA_ADMIN_PASSWORD:-AdminTaskFlow123!}"

            docker compose -f docker-compose.prod.yml pull
            docker compose -f docker-compose.prod.yml up -d --remove-orphans
            docker image prune -f

            echo "TaskFlow deployment with Docker Compose completed successfully!"
          EOF

      - name: Deployment Notice (Skipped)
        if: env.AWS_ACCESS_KEY_ID == '' && (env.EC2_HOST == '' || env.SSH_PRIVATE_KEY == '')
        run: |
          echo "::warning ::Neither AWS SSM credentials (AWS_ACCESS_KEY_ID) nor SSH credentials (EC2_HOST, SSH_PRIVATE_KEY) are configured. Skipping deployment."
