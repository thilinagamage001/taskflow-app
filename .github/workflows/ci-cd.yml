name: TaskFlow CI/CD Pipeline (Docker & AWS)

on:
  push:
    branches: [ "main", "develop" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io

jobs:
  # =========================================================================
  # 1. CONTINUOUS INTEGRATION: LINT & BUILD VERIFICATION
  # =========================================================================
  test-and-verify:
    name: Lint & Build Verification
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: |
            server/package-lock.json
            client/package-lock.json

      - name: Verify Backend Dependencies
        working-directory: server
        run: |
          npm ci

      - name: Verify Frontend Build & Lint
        working-directory: client
        run: |
          npm ci
          npm run lint || true
          npm run build

  # =========================================================================
  # 2. DOCKER IMAGE BUILD & PUSH TO GITHUB CONTAINER REGISTRY (GHCR)
  # =========================================================================
  build-and-push:
    name: Build & Push Docker Images
    needs: test-and-verify
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image_tag: ${{ steps.meta.outputs.sha_short }}
      owner: ${{ steps.lower_owner.outputs.owner }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set short Git commit SHA
        id: meta
        run: echo "sha_short=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT

      - name: Convert repository owner to lowercase for Docker tags
        id: lower_owner
        run: |
          OWNER=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')
          echo "owner=$OWNER" >> $GITHUB_OUTPUT
          echo "OWNER=$OWNER" >> $GITHUB_ENV

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry (GHCR)
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & Push Backend Production Image
        uses: docker/build-push-action@v6
        with:
          context: ./server
          file: ./server/Dockerfile.prod
          push: true
          tags: |
            ghcr.io/${{ env.OWNER }}/taskflow-server:latest
            ghcr.io/${{ env.OWNER }}/taskflow-server:${{ steps.meta.outputs.sha_short }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build & Push Frontend Production Image
        uses: docker/build-push-action@v6
        with:
          context: ./client
          file: ./client/Dockerfile.prod
          push: true
          tags: |
            ghcr.io/${{ env.OWNER }}/taskflow-client:latest
            ghcr.io/${{ env.OWNER }}/taskflow-client:${{ steps.meta.outputs.sha_short }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # =========================================================================
  # 3. CONTINUOUS DEPLOYMENT: DOCKER COMPOSE ON AWS EC2
  # =========================================================================
  deploy:
    name: Deploy with Docker Compose to AWS EC2
    needs: build-and-push
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup SSH Key & Deploy to EC2
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USER: ${{ secrets.EC2_USER || 'ubuntu' }}
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          IMAGE_TAG: ${{ needs.build-and-push.outputs.image_tag }}
          OWNER: ${{ needs.build-and-push.outputs.owner }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ACTOR: ${{ github.actor }}
          MONGODB_URI: ${{ secrets.MONGODB_URI }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
        run: |
          if [ -z "$EC2_HOST" ] || [ -z "$SSH_PRIVATE_KEY" ]; then
            echo "::warning ::EC2_HOST or SSH_PRIVATE_KEY secret is not set. Skipping automated deployment."
            exit 0
          fi

          mkdir -p ~/.ssh
          echo "$SSH_PRIVATE_KEY" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H "$EC2_HOST" >> ~/.ssh/known_hosts

          # Ensure deployment directory exists on remote host
          ssh "$EC2_USER@$EC2_HOST" "mkdir -p /home/ubuntu/taskflow-app"

          # Copy docker-compose.prod.yml to EC2
          scp docker-compose.prod.yml "$EC2_USER@$EC2_HOST":/home/ubuntu/taskflow-app/docker-compose.prod.yml

          # Execute deployment via Docker Compose
          ssh "$EC2_USER@$EC2_HOST" "bash -s" << EOF
            set -e
            cd /home/ubuntu/taskflow-app

            # Create server/.env with production settings if not existing
            mkdir -p server client
            if [ ! -f server/.env ]; then
              cat << 'ENVFILE' > server/.env
          NODE_ENV=production
          PORT=5000
          MONGODB_URI=${MONGODB_URI:-mongodb://mongo:27017/taskflow}
          JWT_SECRET=${JWT_SECRET:-taskflow_super_secret_jwt_key_2024}
          JWT_EXPIRE=7d
          UPLOAD_DIR=uploads
          ENVFILE
            fi

            # Create client/.env
            echo "VITE_API_URL=/api" > client/.env

            # Authenticate with GHCR so private or public images can always be pulled
            echo "${GHCR_TOKEN}" | docker login ghcr.io -u "${ACTOR}" --password-stdin

            # Export production image tags
            export BACKEND_IMAGE="ghcr.io/${OWNER}/taskflow-server:${IMAGE_TAG}"
            export FRONTEND_IMAGE="ghcr.io/${OWNER}/taskflow-client:${IMAGE_TAG}"

            # Pull latest images and restart containers
            docker compose -f docker-compose.prod.yml pull
            docker compose -f docker-compose.prod.yml up -d --remove-orphans

            # Clean up old dangling images
            docker image prune -f

            echo "TaskFlow deployment with Docker Compose completed successfully!"
          EOF
