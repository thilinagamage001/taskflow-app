apiVersion: v1
kind: Secret
metadata:
  name: taskflow-secrets
  namespace: taskflow
type: Opaque
stringData:
  # Replace with your MongoDB Atlas connection string
  MONGODB_URI: "mongodb+srv://<username>:<password>@cluster0.mongodb.net/taskflow?retryWrites=true&w=majority"
  # Replace with a cryptographically secure random string (at least 32 characters)
  JWT_SECRET: "replace_with_a_long_random_jwt_secret_token_key_here"
