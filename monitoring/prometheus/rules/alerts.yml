groups:
  - name: taskflow-alerts
    rules:

      - alert: HighCPUUsage
        expr: |
          100 - (
            avg(rate(node_cpu_seconds_total{mode="idle"}[5m]))
            * 100
          ) > 85
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: High EC2 CPU utilization

      - alert: HighMemoryUsage
        expr: |
          (
            1 -
            node_memory_MemAvailable_bytes /
            node_memory_MemTotal_bytes
          ) * 100 > 85
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: High EC2 memory utilization

      - alert: APIUnavailable
        expr: up{job="taskflow-api"} == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: TaskFlow API metrics endpoint is unavailable

      - alert: HighAPIErrorRate
        expr: |
          (
            sum(rate(http_request_total{status_code=~"5.."}[5m]))
            /
            clamp_min(sum(rate(http_request_total[5m])), 0.001)
          ) > 0.05
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: TaskFlow API HTTP 5xx error rate exceeds 5%