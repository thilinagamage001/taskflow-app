global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:

  # Prometheus itself
  - job_name: prometheus
    static_configs:
      - targets:
          - prometheus:9090

  # TaskFlow API
  - job_name: taskflow-api
    metrics_path: /metrics
    static_configs:
      - targets:
          - api:5000

  # Linux host
  - job_name: node-exporter
    static_configs:
      - targets:
          - node-exporter:9100

  # Docker containers
  - job_name: cadvisor
    static_configs:
      - targets:
          - cadvisor:8080