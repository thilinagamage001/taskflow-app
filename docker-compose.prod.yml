name: taskflow-app

services:
  mongo:
    image: mongo:6.0
    restart: unless-stopped
    volumes:
      - mongo-data:/data/db
    networks:
      - taskflow-network

  api:
    image: ${BACKEND_IMAGE:-taskflow-api:prod}
    build:
      context: ./server
      dockerfile: Dockerfile.prod
    restart: unless-stopped
    env_file:
      - ./server/.env
    environment:
      - NODE_ENV=production
    expose:
      - "5000"
    volumes:
      - uploads-data:/app/uploads
    networks:
      - taskflow-network
    depends_on:
      - mongo

  frontend:
    image: ${FRONTEND_IMAGE:-taskflow-frontend:prod}
    build:
      context: ./client
      dockerfile: Dockerfile.prod
    restart: unless-stopped
    environment:
      - API_PROXY_TARGET=http://api:5000
    ports:
      - "80:80"
    networks:
      - taskflow-network
    depends_on:
      - api

volumes:
  mongo-data:
  uploads-data:

networks:
  taskflow-network:
    driver: bridge
