---
- name: Deploy TaskFlow Application to Azure Free Tier VM
  hosts: taskflow_servers
  become: true
  vars_files:
    - vars.yml

  pre_tasks:
    - name: Wait for server to become reachable via SSH
      ansible.builtin.wait_for_connection:
        delay: 5
        timeout: 300

    - name: Gather system facts
      ansible.builtin.setup:

  tasks:
    # -------------------------------------------------------------
    # 1. SWAP CONFIGURATION (Essential for B1s 1GB RAM)
    # -------------------------------------------------------------
    - name: Check if swapfile already exists
      ansible.builtin.stat:
        path: /swapfile
      register: swapfile_stat

    - name: Create 2GB swapfile if not present
      ansible.builtin.command:
        cmd: dd if=/dev/zero of=/swapfile bs=1M count={{ swap_size_mb }}
      when: not swapfile_stat.stat.exists

    - name: Set correct permissions on swapfile
      ansible.builtin.file:
        path: /swapfile
        owner: root
        group: root
        mode: "0600"
      when: not swapfile_stat.stat.exists

    - name: Format swapfile
      ansible.builtin.command:
        cmd: mkswap /swapfile
      when: not swapfile_stat.stat.exists

    - name: Enable swapfile
      ansible.builtin.command:
        cmd: swapon /swapfile
      when: not swapfile_stat.stat.exists

    - name: Add swapfile to /etc/fstab for persistence
      ansible.posix.mount:
        name: none
        src: /swapfile
        fstype: swap
        opts: sw
        state: present

    - name: Configure kernel swappiness
      ansible.posix.sysctl:
        name: vm.swappiness
        value: "{{ swappiness }}"
        state: present
        reload: true

    # -------------------------------------------------------------
    # 2. INSTALL DOCKER & DOCKER COMPOSE
    # -------------------------------------------------------------
    - name: Update apt cache and install prerequisites
      ansible.builtin.apt:
        name:
          - ca-certificates
          - curl
          - gnupg
          - rsync
          - ufw
        state: present
        update_cache: true

    - name: Create keyrings directory
      ansible.builtin.file:
        path: /etc/apt/keyrings
        state: directory
        mode: "0755"

    - name: Download Docker official GPG key
      ansible.builtin.get_url:
        url: https://download.docker.com/linux/ubuntu/gpg
        dest: /etc/apt/keyrings/docker.asc
        mode: "0644"

    - name: Add Docker APT repository
      ansible.builtin.apt_repository:
        repo: "deb [arch={{ ansible_architecture | regex_replace('x86_64', 'amd64') }} signed-by=/etc/apt/keyrings/docker.asc] https://download.docker.com/linux/ubuntu {{ ansible_distribution_release }} stable"
        state: present
        filename: docker

    - name: Install Docker CE, CLI, and Compose plugin
      ansible.builtin.apt:
        name:
          - docker-ce
          - docker-ce-cli
          - containerd.io
          - docker-buildx-plugin
          - docker-compose-plugin
        state: present
        update_cache: true

    - name: Add deployment user to docker group
      ansible.builtin.user:
        name: "{{ app_user }}"
        groups: docker
        append: true

    - name: Ensure Docker service is running and enabled
      ansible.builtin.service:
        name: docker
        state: started
        enabled: true

    # -------------------------------------------------------------
    # 3. DEPLOY APPLICATION
    # -------------------------------------------------------------
    - name: Create application directory
      ansible.builtin.file:
        path: "{{ app_dir }}"
        state: directory
        owner: "{{ app_user }}"
        group: "{{ app_user }}"
        mode: "0755"

    - name: Sync TaskFlow project codebase to remote VM
      ansible.posix.synchronize:
        src: "{{ playbook_dir }}/../../"
        dest: "{{ app_dir }}/"
        delete: false
        rsync_opts:
          - "--exclude=.git"
          - "--exclude=node_modules"
          - "--exclude=client/node_modules"
          - "--exclude=server/node_modules"
          - "--exclude=client/dist"
          - "--exclude=deploy"
          - "--exclude=.env.local"
      become: false

    - name: Render production environment file for server
      ansible.builtin.template:
        src: templates/server.env.j2
        dest: "{{ app_dir }}/server/.env"
        owner: "{{ app_user }}"
        group: "{{ app_user }}"
        mode: "0600"

    # -------------------------------------------------------------
    # 4. BUILD & RUN CONTAINERS
    # -------------------------------------------------------------
    - name: Build and launch TaskFlow containers via Docker Compose
      ansible.builtin.command:
        cmd: docker compose -f docker-compose.prod.yml up -d --build
        chdir: "{{ app_dir }}"

    # -------------------------------------------------------------
    # 5. HEALTH CHECK & DATABASE SEEDING
    # -------------------------------------------------------------
    - name: Wait for TaskFlow API to become healthy
      ansible.builtin.uri:
        url: "http://127.0.0.1/api/health"
        status_code: 200
        return_content: yes
      register: api_health
      until: api_health.status == 200
      retries: 24
      delay: 5

    - name: Check if database has already been seeded
      ansible.builtin.stat:
        path: "{{ app_dir }}/.seeded"
      register: seeded_marker

    - name: Seed database with initial demo data (first run only)
      ansible.builtin.command:
        cmd: docker compose -f docker-compose.prod.yml exec -T api npm run seed
        chdir: "{{ app_dir }}"
      when:
        - seed_database | bool
        - not seeded_marker.stat.exists
      register: seed_result
      ignore_errors: true

    - name: Create seeded marker file
      ansible.builtin.file:
        path: "{{ app_dir }}/.seeded"
        state: touch
        owner: "{{ app_user }}"
        group: "{{ app_user }}"
        mode: "0644"
      when:
        - seed_database | bool
        - not seeded_marker.stat.exists

    - name: Display deployment success information
      ansible.builtin.debug:
        msg:
          - "=========================================================="
          - " TaskFlow successfully deployed to Azure Free Tier!       "
          - " Web URL: http://{{ ansible_host }}                       "
          - " Demo Email: demo@taskflow.com                           "
          - " Demo Password: Demo1234                                 "
          - "=========================================================="
