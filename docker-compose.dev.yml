name: taskflow-app

services:
  mongo:
    image: mongo:6.0
    ports: 
      - 27017:27017
    volumes:
      - mongo-data:/data/db
    networks:
      - taskflow-network
  prometheus:
    image: prom/prometheus:latest
    container_name: taskflow-prometheus
    restart: unless-stopped
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./monitoring/prometheus/rules:/etc/prometheus/rules:ro
      - prometheus-data:/prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=7d
      - --web.enable-lifecycle
    expose:
      - "9090"
    networks:
      - taskflow-network

  node-exporter:
    image: prom/node-exporter:latest
    container_name: taskflow-node-exporter
    restart: unless-stopped
    pid: host
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    command:
      - --path.procfs=/host/proc
      - --path.sysfs=/host/sys
      - --path.rootfs=/rootfs
      - --collector.filesystem.mount-points-exclude=^/(dev|proc|sys|var/lib/docker/.+|var/lib/containers/storage/.+)($$|/)
    expose:
      - "9100"
    networks:
      - taskflow-network

  cadvisor:
    image: gcr.io/cadvisor/cadvisor:latest
    container_name: taskflow-cadvisor
    restart: unless-stopped
    privileged: true
    devices:
      - /dev/kmsg
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker:/var/lib/docker:ro
      - /dev/disk:/dev/disk:ro
    expose:
      - "8080"
    networks:
      - taskflow-network

  grafana:
    image: grafana/grafana:latest
    container_name: taskflow-grafana
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD}
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - grafana-data:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      - prometheus
    networks:
      - taskflow-network


      
  api:
    build:
      context: ./server
      dockerfile: Dockerfile.dev
    restart: unless-stopped
    env_file: ./server/.env
    volumes: 
      - ./server:/app
      - /app/node_modules
    networks:
      - taskflow-network
    ports: 
      - 5000:5000
    depends_on:
      - mongo

  frontend:
    build:
      context: ./client
      dockerfile: Dockerfile.dev
    restart: unless-stopped
    env_file: ./client/.env
    environment:
      - VITE_PROXY_TARGET=http://api:5000
    volumes: 
      - ./client:/app
      - /app/node_modules
    networks:
      - taskflow-network
    ports:
      - 5173:5173
    depends_on:
      - api

volumes:
  mongo-data:
  uploads-data:
  prometheus-data:
  grafana-data:

networks:
  taskflow-network:
    driver: bridge

