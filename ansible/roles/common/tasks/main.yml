---
- name: Ensure basic utility packages are installed
  ansible.builtin.apt:
    name:
      - ca-certificates
      - curl
      - gnupg
      - git
      - htop
      - ufw
    state: present
    update_cache: true

- name: Check if swapfile exists
  ansible.builtin.stat:
    path: /swapfile
  register: swapfile_stat

- name: Create 2GB swapfile for 1GB RAM EC2 stability
  ansible.builtin.command:
    cmd: fallocate -l 2G /swapfile
  when: not swapfile_stat.stat.exists
  changed_when: true

- name: Set secure permissions on swapfile
  ansible.builtin.file:
    path: /swapfile
    owner: root
    group: root
    mode: "0600"

- name: Format swapfile
  ansible.builtin.command:
    cmd: mkswap /swapfile
  when: not swapfile_stat.stat.exists
  changed_when: true

- name: Enable swap
  ansible.builtin.command:
    cmd: swapon /swapfile
  when: not swapfile_stat.stat.exists
  changed_when: true

- name: Persist swapfile in /etc/fstab
  ansible.posix.mount:
    name: none
    src: /swapfile
    fstype: swap
    opts: sw
    state: present

- name: Set vm.swappiness to 10
  ansible.posix.sysctl:
    name: vm.swappiness
    value: "10"
    state: present
    reload: true
