---
- name: Provision Lightweight Kubernetes (K3s) on AWS Free Tier EC2
  hosts: k8s_nodes
  become: true
  vars:
    swap_size_gb: 2
    k3s_version: "v1.31.2+k3s1"

  tasks:
    - name: Update apt cache and install prerequisites
      apt:
        update_cache: yes
        cache_valid_time: 3600
        pkg:
          - curl
          - git
          - ca-certificates
          - gnupg
          - apt-transport-https
          - net-tools
        state: present

    # =========================================================================
    # 1. CONFIGURE 2GB SWAP FILE (ESSENTIAL FOR 1GB RAM EC2 t2.micro / t3.micro)
    # =========================================================================
    - name: Check if swapfile exists
      stat:
        path: /swapfile
      register: swapfile_check

    - name: Create swapfile using fallocate
      command: "fallocate -l {{ swap_size_gb }}G /swapfile"
      when: not swapfile_check.stat.exists

    - name: Set secure permissions on swapfile
      file:
        path: /swapfile
        mode: '0600'
        owner: root
        group: root
      when: not swapfile_check.stat.exists

    - name: Format swapfile
      command: mkswap /swapfile
      when: not swapfile_check.stat.exists

    - name: Enable swapfile
      command: swapon /swapfile
      when: not swapfile_check.stat.exists

    - name: Persist swap in /etc/fstab
      mount:
        name: none
        src: /swapfile
        fstype: swap
        opts: sw
        state: present

    - name: Tune kernel swappiness to reduce aggressive swapping
      sysctl:
        name: vm.swappiness
        value: '10'
        state: present
        reload: yes

    # =========================================================================
    # 2. KERNEL & NETWORKING PREREQUISITES FOR KUBERNETES
    # =========================================================================
    - name: Enable IPv4 forwarding for pod network routing
      sysctl:
        name: net.ipv4.ip_forward
        value: '1'
        state: present
        reload: yes

    # =========================================================================
    # 3. INSTALL K3S (LIGHTWEIGHT CERTIFIED KUBERNETES)
    # =========================================================================
    - name: Check if k3s is already installed
      command: which k3s
      register: k3s_check
      failed_when: false
      changed_when: false

    - name: Install K3s single-node cluster (with Traefik Ingress enabled)
      shell: >
        curl -sfL https://get.k3s.io |
        INSTALL_K3S_VERSION="{{ k3s_version }}"
        INSTALL_K3S_EXEC="--write-kubeconfig-mode 644 --tls-san {{ ansible_host }}"
        sh -
      when: k3s_check.rc != 0

    - name: Ensure K3s systemd service is active and enabled
      systemd:
        name: k3s
        state: started
        enabled: yes

    # =========================================================================
    # 4. CONFIGURE KUBECTL ENVIRONMENT FOR 'ubuntu' USER
    # =========================================================================
    - name: Create .kube directory for ubuntu user
      file:
        path: /home/ubuntu/.kube
        state: directory
        owner: ubuntu
        group: ubuntu
        mode: '0755'

    - name: Copy K3s kubeconfig to ubuntu user home
      copy:
        src: /etc/rancher/k3s/k3s.yaml
        dest: /home/ubuntu/.kube/config
        remote_src: yes
        owner: ubuntu
        group: ubuntu
        mode: '0600'

    - name: Add KUBECONFIG export to ubuntu .bashrc
      lineinfile:
        path: /home/ubuntu/.bashrc
        line: 'export KUBECONFIG=/home/ubuntu/.kube/config'
        state: present

    # =========================================================================
    # 5. FETCH REMOTE KUBECONFIG LOCALLY (OPTIONAL FOR LOCAL KUBECTL USAGE)
    # =========================================================================
    - name: Fetch kubeconfig to local machine for remote administration
      fetch:
        src: /etc/rancher/k3s/k3s.yaml
        dest: "{{ playbook_dir }}/../k3s.yaml"
        flat: yes

    - name: Adjust server IP in downloaded kubeconfig
      delegate_to: localhost
      become: false
      replace:
        path: "{{ playbook_dir }}/../k3s.yaml"
        regexp: '127\.0\.0\.1'
        replace: "{{ ansible_host }}"
      ignore_errors: yes

    # =========================================================================
    # 6. VERIFY NODE HEALTH
    # =========================================================================
    - name: Wait for Kubernetes Node to become Ready
      command: kubectl get nodes --no-headers
      register: node_status
      until: "'Ready' in node_status.stdout"
      retries: 15
      delay: 5
      changed_when: false

    - name: Display cluster status
      debug:
        msg: "K3s is up and running successfully on {{ ansible_host }}!"
